<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'Segoe UI Variable Display','Segoe UI',Inter,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" role="img" aria-label="Smart Innova — enterprise software studio">
<style>
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .fade { opacity: 0; animation: fade .9s ease-out forwards; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .orb { animation: drift 18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  .orb2 { animation-duration: 24s; animation-direction: alternate-reverse; }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(-60px,30px) scale(1.15); } }
  .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.8); } }
  .caret { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .scan { animation: scan 6s linear infinite; }
  @keyframes scan { from { transform: translateX(-400px); } to { transform: translateX(1400px); } }
</style>
<defs>
  <linearGradient id="h-acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0B7A54"/><stop offset=".55" stop-color="#0284C7"/><stop offset="1" stop-color="#4F46E5"/>
  </linearGradient>
  <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F6F9FC"/><stop offset="1" stop-color="#EEF4FA"/>
  </linearGradient>
  <pattern id="h-grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#E3EAF3" stroke-width="1"/>
  </pattern>
  <radialGradient id="h-o1"><stop offset="0" stop-color="#0B7A54" stop-opacity="0.22"/><stop offset="1" stop-color="#0B7A54" stop-opacity="0"/></radialGradient>
  <radialGradient id="h-o2"><stop offset="0" stop-color="#4F46E5" stop-opacity="0.18"/><stop offset="1" stop-color="#4F46E5" stop-opacity="0"/></radialGradient>
  <linearGradient id="h-fadeR" x1="0" x2="1"><stop offset="0" stop-color="#F6F9FC" stop-opacity="1"/><stop offset=".45" stop-color="#F6F9FC" stop-opacity=".2"/><stop offset="1" stop-color="#F6F9FC" stop-opacity="0"/></linearGradient>
  <linearGradient id="h-scan" x1="0" x2="1"><stop offset="0" stop-color="#0284C7" stop-opacity="0"/><stop offset=".5" stop-color="#0284C7" stop-opacity=".7"/><stop offset="1" stop-color="#0284C7" stop-opacity="0"/></linearGradient>
  <clipPath id="h-clip"><rect width="1200" height="380" rx="24"/></clipPath>
</defs>
<g clip-path="url(#h-clip)">
  <rect width="1200" height="380" fill="url(#h-bg)"/>
  <rect width="1200" height="380" fill="url(#h-grid)" opacity=".7"/>
  <circle class="orb" cx="960" cy="90" r="300" fill="url(#h-o1)"/>
  <circle class="orb orb2" cx="1120" cy="330" r="260" fill="url(#h-o2)"/>
  <rect width="1200" height="380" fill="url(#h-fadeR)"/>
  <rect class="scan" x="0" y="378" width="400" height="2" fill="url(#h-scan)"/>
  <!-- code window (right) -->
  <g class="fade" style="animation-delay:.5s" transform="translate(770 70)">
    <rect width="360" height="236" rx="16" fill="#FFFFFF" stroke="#DCE4EE" opacity=".96"/>
    <circle cx="22" cy="22" r="5" fill="#FF5F57"/><circle cx="40" cy="22" r="5" fill="#FEBC2E"/><circle cx="58" cy="22" r="5" fill="#28C840"/>
    <text x="340" y="27" text-anchor="end" font-family="'JetBrains Mono','Cascadia Code',SFMono-Regular,Consolas,Menlo,monospace" font-size="12" fill="#8D9AB0">company.yml</text>
    <line x1="0" y1="44" x2="360" y2="44" stroke="#DCE4EE"/>
    <g font-family="'JetBrains Mono','Cascadia Code',SFMono-Regular,Consolas,Menlo,monospace" font-size="14">
      <text x="22" y="76"><tspan fill="#4F46E5">name</tspan><tspan fill="#566580">: </tspan><tspan fill="#0B1324">Smart Innova</tspan></text>
      <text x="22" y="102"><tspan fill="#4F46E5">based</tspan><tspan fill="#566580">: </tspan><tspan fill="#0B1324">Azerbaijan</tspan></text>
      <text x="22" y="128"><tspan fill="#4F46E5">builds</tspan><tspan fill="#566580">: </tspan><tspan fill="#0B1324">[web, mobile, api]</tspan></text>
      <text x="22" y="154"><tspan fill="#4F46E5">stack</tspan><tspan fill="#566580">: </tspan><tspan fill="#0B1324">[java, spring, flutter]</tspan></text>
      <text x="22" y="180"><tspan fill="#4F46E5">now</tspan><tspan fill="#566580">: </tspan><tspan fill="#0B7A54">"Binam.az"</tspan></text>
      <text x="22" y="206"><tspan fill="#4F46E5">open_to</tspan><tspan fill="#566580">: </tspan><tspan fill="#0B1324">partners</tspan><tspan class="caret" fill="#0284C7">▍</tspan></text>
    </g>
  </g>
  <g class="fade" style="animation-delay:.05s">
    <g transform="translate(72 64)">
      <rect width="64" height="64" rx="18" fill="#FFFFFF" stroke="#DCE4EE"/>
      <rect x="14" y="15" width="36" height="9" rx="4.5" fill="url(#h-acc)"/>
      <rect x="14" y="27.5" width="22" height="9" rx="4.5" fill="#0284C7" opacity=".85"/>
      <rect x="28" y="40" width="22" height="9" rx="4.5" fill="#4F46E5" opacity=".85"/>
    </g></g>
  <g class="fade" style="animation-delay:.15s">
    <text x="156" y="94" font-size="15" font-weight="600" letter-spacing="2.5" fill="#566580">SOFTWARE STUDIO</text>
    <g transform="translate(156 112)"><circle class="pulse" cx="5" cy="0" r="4" fill="#0B7A54"/><circle cx="5" cy="0" r="4" fill="#0B7A54"/>
    <text x="18" y="5" font-size="14" fill="#566580">Shipping <tspan fill="#0B1324" font-weight="600">Binam.az</tspan> — building management, reimagined</text></g>
  </g>
  <text class="fade" style="animation-delay:.25s" x="68" y="208" font-size="76" font-weight="700" letter-spacing="-2.5" fill="#0B1324">Smart <tspan fill="url(#h-acc)">Innova</tspan></text>
  <text class="fade" style="animation-delay:.4s" x="72" y="246" font-size="21" fill="#566580">Enterprise software that runs real operations — from billing to banking.</text>
  <g class="fade" style="animation-delay:0.7s"><rect x="72" y="268" width="187.79999999999998" height="32" rx="16" fill="#FFFFFF" stroke="#DCE4EE"/><text x="165.89999999999998" y="289" text-anchor="middle" font-size="14" font-weight="500" fill="#566580">Utilities &amp; Billing</text></g><g class="fade" style="animation-delay:0.7799999999999999s"><rect x="269.79999999999995" y="268" width="105.8" height="32" rx="16" fill="#FFFFFF" stroke="#DCE4EE"/><text x="322.69999999999993" y="289" text-anchor="middle" font-size="14" font-weight="500" fill="#566580">Inventory</text></g><g class="fade" style="animation-delay:0.86s"><rect x="385.59999999999997" y="268" width="130.39999999999998" height="32" rx="16" fill="#FFFFFF" stroke="#DCE4EE"/><text x="450.79999999999995" y="289" text-anchor="middle" font-size="14" font-weight="500" fill="#566580">HR &amp; Payroll</text></g><g class="fade" style="animation-delay:0.94s"><rect x="526" y="268" width="89.39999999999999" height="32" rx="16" fill="#FFFFFF" stroke="#DCE4EE"/><text x="570.7" y="289" text-anchor="middle" font-size="14" font-weight="500" fill="#566580">Banking</text></g><g class="fade" style="animation-delay:1.02s"><rect x="625.4" y="268" width="97.6" height="32" rx="16" fill="#FFFFFF" stroke="#DCE4EE"/><text x="674.1999999999999" y="289" text-anchor="middle" font-size="14" font-weight="500" fill="#566580">PropTech</text></g>
</g>
<rect x=".5" y=".5" width="1199" height="379" rx="24" fill="none" stroke="#DCE4EE"/>
</svg>